<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eficiencia Solar - Avaliação Técnica</title>
  <link rel="stylesheet" href="style.css">

  <!-- Biblioteca PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="container">

  <h1 class="titulo">Eficiência Solar</h1>

  <form id="avaliacaoForm">

    <div class="grid">

      <div class="input-group">
        <label>Cliente</label>
        <input type="text" id="cliente" required>
      </div>

      <div class="input-group">
        <label>Endereço</label>
        <input type="text" id="endereco" required>
      </div>

      <div class="input-group">
        <label>Número do Poste</label>
        <input type="text" id="poste">
      </div>

      <div class="input-group">
        <label>Número do Medidor</label>
        <input type="text" id="medidor">
      </div>

      <div class="input-group">
        <label>Tipo de Saída</label>
        <select id="saida">
          <option>Aéreo</option>
          <option>Subterrâneo</option>
        </select>
      </div>

      <div class="input-group">
        <label>Sistema</label>
        <select id="sistema">
          <option>Monofásico</option>
          <option>Bifásico</option>
          <option>Trifásico</option>
        </select>
      </div>

      <div class="input-group">
        <label>Tensão</label>
        <select id="tensao">
          <option>380V</option>
          <option>220V</option>
        </select>
      </div>

      <div class="input-group">
        <label>Disjuntor do Relógio</label>
        <input type="text" id="disjRelogio">
      </div>

      <div class="input-group">
        <label>Bitola do Cabo</label>
        <input type="text" id="bitola">
      </div>

      <div class="input-group">
        <label>Disjuntor Geral</label>
        <input type="text" id="disjGeral">
      </div>

      <div class="input-group">
        <label>Possui Gerador?</label>
        <select id="gerador">
          <option>Não</option>
          <option>Sim</option>
        </select>
      </div>

      <div class="input-group" id="potenciaGroup" style="display:none;">
        <label>Potência do Gerador</label>
        <input type="text" id="potencia">
      </div>

      <div class="input-group">
        <label>Estrutura de Montagem</label>
        <select id="estrutura">
          <option>Telhado</option>
          <option>Solo</option>
          <option>Galpão</option>
        </select>
      </div>

      <div class="input-group">
        <label>Material da Terça</label>
        <input type="text" id="material">
      </div>

      <div class="input-group">
        <label>Distância entre as Terças</label>
        <input type="text" id="distancia">
      </div>

    </div>

    <h2 class="subtitulo">Fotos</h2>

    <div class="photos-grid">

      <div class="photo-group">
        <label>Caixa do Medidor</label>
        <input type="file" id="foto1" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Disjuntor de Entrada</label>
        <input type="file" id="foto2" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Medidor</label>
        <input type="file" id="foto3" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Padrão</label>
        <input type="file" id="foto4" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Número do Poste</label>
        <input type="file" id="foto5" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Quadro de Distribuição</label>
        <input type="file" id="foto6" accept="image/*">
      </div>

      <div class="photo-group">
        <label>Telhado Localização</label>
        <input type="file" id="foto7" accept="image/*">
      </div>

    </div>

    <button type="submit" class="btn">Gerar PDF</button>

  </form>

</div>

<script src="script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="script.js"></script>
</body>
</html>
