<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Técnica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Avaliação Técnica</h1>

  <form id="avaliacaoForm">

    <div class="grid">
      <div class="input-group">
        <label>Cliente</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>Endereço</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>Número do Poste</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Número do Medidor</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Tipo de Saída</label>
        <select>
          <option>Aéreo</option>
          <option>Subterrâneo</option>
        </select>
      </div>

      <div class="input-group">
        <label>Sistema</label>
        <select>
          <option>Monofásico</option>
          <option>Bifásico</option>
          <option>Trifásico</option>
        </select>
      </div>

      <div class="input-group">
        <label>Tensão</label>
        <select>
          <option>380V</option>
          <option>220V</option>
        </select>
      </div>

      <div class="input-group">
        <label>Disjuntor do Relógio</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Bitola do Cabo</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Disjuntor Geral</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Possui Gerador?</label>
        <select id="geradorSelect">
          <option>Não</option>
          <option>Sim</option>
        </select>
      </div>

      <div class="input-group" id="potenciaGroup" style="display:none;">
        <label>Potência do Gerador</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Estrutura de Montagem</label>
        <select>
          <option>Telhado</option>
          <option>Solo</option>
          <option>Galpão</option>
        </select>
      </div>

      <div class="input-group">
        <label>Material da Terça</label>
        <input type="text">
      </div>

      <div class="input-group">
        <label>Distância entre as Terças</label>
        <input type="text">
      </div>
    </div>

    <h2>Fotos</h2>

    <div class="photos-grid">
      <div class="photo-group">
        <label>Caixa do Medidor</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Disjuntor de Entrada</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Medidor</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Padrão</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Número do Poste</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Quadro de Distribuição</label>
        <input type="file" accept="image/*" capture="environment">
      </div>

      <div class="photo-group">
        <label>Telhado Localização</label>
        <input type="file" accept="image/*" capture="environment">
      </div>
    </div>

    <button type="submit" class="btn">Enviar Avaliação</button>

  </form>
</div>

<script src="script.js"></script>
</body>
</html>
